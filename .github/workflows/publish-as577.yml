name: Publish AS577 IPv4 feed

on:
  schedule:
    - cron: '17 7 1 * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: generated

      - name: Build and publish the feed
        shell: bash
        run: |
          temp_dir=$(mktemp -d)
          trap 'rm -rf -- "$temp_dir"' EXIT
          curl --fail --silent --show-error --location --max-time 30 \
            --output "$temp_dir/source.json" \
            https://raw.githubusercontent.com/ipverse/as-ip-blocks/master/as/577/aggregated.json

          jq -ers '
            def octet: "(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])";
            def ipv4_cidr:
              type == "string" and
              test("\\A(" + octet + "\\.){3}" + octet + "/([0-9]|[12][0-9]|3[0-2])\\z");

            if length == 1 and .[0].asn == 577 then
              .[0].prefixes.ipv4
              | if type == "array" and length > 0 and all(.[]; ipv4_cidr) then
                  .[]
                else
                  error("Expected a nonempty array of IPv4 CIDRs")
                end
            else
              error("Expected a single JSON document for AS577")
            end
          ' "$temp_dir/source.json" > "$temp_dir/feed.txt"

          mv "$temp_dir/feed.txt" as577-ipv4.txt
          git add -- as577-ipv4.txt
          if git diff --cached --quiet -- as577-ipv4.txt; then
            echo "AS577 IPv4 feed is unchanged."
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update AS577 IPv4 feed" -- as577-ipv4.txt
          git push origin HEAD:refs/heads/generated
